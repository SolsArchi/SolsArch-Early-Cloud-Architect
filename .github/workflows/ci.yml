name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      SOLSARCH_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the test runner
        run: python -m pip install pytest
      - name: Check the skill folder
        run: python solsarch-early-cloud-architect/scripts/validate_skill.py solsarch-early-cloud-architect
      - name: Run the tests
        run: python -m pytest tests -q -k "not every_repo_shape"
      - name: Run the self-check
        run: python solsarch-early-cloud-architect/scripts/eval_harness.py run

  security:
    name: Static security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Bandit
        run: |
          python -m pip install "bandit[toml]"
          bandit -c pyproject.toml -r solsarch-early-cloud-architect/scripts install.py tools -q --severity-level medium
